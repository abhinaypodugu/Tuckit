name: iOS Simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee unit-tests.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-tests.log
          if-no-files-found: warn

  build-and-screenshot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Tuckii.xcodeproj -scheme Tuckii -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Choose simulator
        id: sim
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime in sorted(data["devices"], reverse=True):
              for device in data["devices"][runtime]:
                  if device["name"].startswith("iPhone"):
                      print("udid=" + device["udid"])
                      print("name=" + device["name"])
                      raise SystemExit
          raise SystemExit("No iPhone simulator found")
          EOF

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light

      - name: Install
        run: |
          xcrun simctl install "${{ steps.sim.outputs.udid }}" build/Build/Products/Debug-iphonesimulator/Tuckii.app

      - name: Capture screens
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p artifacts
          for screen in home home-dark onboarding collection details search settings focus paywall; do
            xcrun simctl terminate "$UDID" com.example.tuckii 2>/dev/null || true
            if [ "$screen" = "home" ]; then
              xcrun simctl launch "$UDID" com.example.tuckii --seed-demo
            elif [ "$screen" = "home-dark" ]; then
              xcrun simctl launch "$UDID" com.example.tuckii --seed-demo --dark
            else
              xcrun simctl launch "$UDID" com.example.tuckii "--screen=$screen"
            fi
            sleep 6
            xcrun simctl io "$UDID" screenshot "artifacts/$screen.png"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: artifacts
          if-no-files-found: warn
